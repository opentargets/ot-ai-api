name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build and push to GHCR only (skips GAR)'
        required: true

jobs:
  build:
    name: Build and push 🚢
    runs-on: ubuntu-22.04
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    env:
      REPO: ${{ github.event.repository.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG=$(echo "$TAG" | sed 's/^v//')
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "The tag for this build is $TAG"
          echo "The repo name is: $REPO"

          if [ "${{ github.event_name }}" = "push" ]; then
            TAGS="ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:$TAG
          europe-west1-docker.pkg.dev/open-targets-eu-dev/$REPO/$REPO:latest
          europe-west1-docker.pkg.dev/open-targets-eu-dev/$REPO/$REPO:$TAG"
          else
            TAGS="ghcr.io/${{ github.repository }}:$TAG"
          fi
          echo "TAGS<<EOF" >> $GITHUB_ENV
          echo "$TAGS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: auth-google
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          project_id: 'open-targets-eu-dev'
          workload_identity_provider: projects/426265110888/locations/global/workloadIdentityPools/github-actions/providers/opentargets
          service_account: github-actions@open-targets-eu-dev.iam.gserviceaccount.com
          access_token_lifetime: 300s

      - id: auth-gar
        name: Login to Google Artifact Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth-google.outputs.access_token }}

      - id: auth-ghcr
        name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.TAGS }}

      - id: generate-attestations
        name: Generate artifact attestation
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: europe-west1-docker.pkg.dev/open-targets-eu-dev/${{ env.REPO }}/${{ env.REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
